apiVersion: v1
kind: Service
metadata:
  name: {{ include "arbitrum_stack.fullname" . }}
  labels:
    {{- include "arbitrum_stack.labels" . | nindent 4 }}
  annotations:
    # AWS
    #service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    #service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "tcp"
    #service.beta.kubernetes.io/aws-load-balancer-proxy-protocol: "*"
    #service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: {{ .Values.service.type }}
  {{- if ne "ClusterIP" .Values.service.type }}
  externalTrafficPolicy: Local
  {{- end }}
  ports:
    - name: feed-port
      targetPort: feed-port
      port: {{ .Values.service.port.feed_output }}
      protocol: TCP
    - name: ws
      port: {{ .Values.service.port.ws }}
      targetPort: ws
      protocol: TCP
    - name: http
      port: {{ .Values.service.port.http }}
      targetPort: http
      protocol: TCP

  selector:
    {{- include "arbitrum_stack.selectorLabels" . | nindent 4 }}
