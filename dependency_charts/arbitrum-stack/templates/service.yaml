apiVersion: v1
kind: Service
metadata:
  name: {{ include "arbitrum_stack.fullname" . }}
  labels:
    {{- include "arbitrum_stack.labels" . | nindent 4 }}
  annotations:
    # AWS
    #service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    #service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "tcp"
    #service.beta.kubernetes.io/aws-load-balancer-proxy-protocol: "*"
    #service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: {{ .Values.service.type }}
  {{- if ne "ClusterIP" .Values.service.type }}
  externalTrafficPolicy: Local
  {{- end }}
  ports:
    - name: api
      port: {{ .Values.service.port.http }}
      targetPort: api
      protocol: TCP
    - name: p2p
      port: {{ include "arbitrum_stack.p2p" . }}
      targetPort: p2p
      protocol: TCP
    - name: rpc
      port: {{ include "arbitrum_stack.rpc" . }}
      targetPort: rpc
      protocol: TCP
    - name: grpc
      port: {{ include "arbitrum_stack.grpc" . }}
      targetPort: grpc
      protocol: TCP
    - name: abci
      port: {{ include "arbitrum_stack.abci" . }}
      protocol: TCP
      targetPort: abci
    - name: prom-collector
      port: {{ include "arbitrum_stack.prometheus_collector" . }}
      targetPort: prom-collector
      protocol: TCP
  selector:
    {{- include "arbitrum_stack.selectorLabels" . | nindent 4 }}
