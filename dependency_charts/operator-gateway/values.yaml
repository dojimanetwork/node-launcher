  tag: 15af188_1.0.0

imagePullSecrets: []
nameOverride: "operator-gateway"
fullnameOverride: "operator-gateway"

persistence:
  enabled: false
  size:
    testnet: 10Gi
#    mainnet: 50Gi
    stagenet: 10Gi
#    mocknet: 10Gi
  accessMode: ReadWriteOnce
  # existingClaim: your-pvc
#  storageClass: gp2
  # hostPath: /host-path

