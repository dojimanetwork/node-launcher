  HERMES_TENDERMINT_URL: hermesnode:26657
  HTTP_AUTH_HANDLER_PORT: "0.0.0.0:1219"
  PORT: "0.0.0.0:8090"
  HTTP_AUTH_HOST: 0.0.0.0
  HTTP_AUTH_PORT: 1219
  DOT_HOST: polkadot-daemon.operator-gateway-1
  SOL_HOST: 4.186.24.152
  ETH_HOST: ethereum-daemon.operator-gateway-1


replicaCount: 1

strategyType: Recreate

image:
  repository: asia-south1-docker.pkg.dev/prod-dojima/testnet/hermes
