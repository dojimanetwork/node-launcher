# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

net: testnet

replicaCount: 1

image:
  blockscout:
    repository: blockscout/blockscout
    pullPolicy: IfNotPresent
    tag: "latest"
    hash: "sha256:9d76e4077c5364d2ba0a7118bd5cecb0ee152b95a501c257c3a74895a0020b9e"
  smartcontract_verifier:
    repository: ghcr.io/blockscout/smart-contract-verifier
    testnet:
      tag: main
  stats:
    repository: ghcr.io/blockscout/stats
    tag: main
    hash: 7550adcc071b4bb837b80d69969024e3701152014b561e052c6ac0eb08d7fb9b
  postgres:
    image: postgres:13.4
  frontend:
    repository: mainnet.azurecr.io/blockscout-v2
    tag: e0d80855_1.0.0
    hash: "sha256:017b29dba1403ca0b56614b8d5b4a9fc25da971ef5583ff8be26a8a62825dfd4"

frontend:
  environment:
    NEXT_PUBLIC_VISUALIZE_API_HOST:
      _default: https://visualizer.services.blockscout.com
    NEXT_PUBLIC_CONTRACT_INFO_API_HOST:
      _default: https://contracts-info.services.blockscout.com
    NEXT_PUBLIC_NETWORK_NAME:
      _default: Dojima Network
    NEXT_PUBLIC_NETWORK_SHORT_NAME:
      _default: DOJ
    NEXT_PUBLIC_NETWORK_CURRENCY_NAME:
      _default: Dojima Network
    NEXT_PUBLIC_NETWORK_CURRENCY_SYMBOL:
      _default: DOJ
    NEXT_PUBLIC_NETWORK_CURRENCY_DECIMALS:
      _default: 18
    NEXT_PUBLIC_FEATURED_NETWORKS:
      _default: https://raw.githubusercontent.com/blockscout/frontend-configs/main/configs/featured-networks/eth-goerli.json
    NEXT_PUBLIC_API_BASE_PATH:
      _default: /
    NEXT_PUBLIC_HOMEPAGE_CHARTS:
      _default: "['daily_txs','coin_price']"
    NEXT_PUBLIC_IS_TESTNET:
      _default: false
    NEXT_PUBLIC_AD_BANNER_PROVIDER:
      _default: none
    NEXT_PUBLIC_AD_TEXT_PROVIDER:
      _default: none
    NEXT_PUBLIC_NETWORK_LOGO:
      _default: https://dojima-images.s3.ap-south-1.amazonaws.com/landing-page-v3/logo_white_bgd.svg
    NEXT_PUBLIC_NETWORK_LOGO_DARK:
      _default: https://block-exlporer.s3.ap-south-1.amazonaws.com/dojima_logo_white.svg
    NEXT_PUBLIC_NETWORK_ICON:
      _default: https://storage.googleapis.com/dojima_wallet/Dojima_Network_3D_Logo%202.png
    NEXT_PUBLIC_API_SPEC_URL:
      _default: https://raw.githubusercontent.com/blockscout/blockscout-api-v2-swagger/main/swagger.yaml
    NEXT_PUBLIC_API_PROTOCOL:
      _default: http
    NEXT_PUBLIC_API_WEBSOCKET_PROTOCOL:
      _default: ws

stats:
  environment:
    RUST_LOG:
      _default: info
    STATS__RUN_MIGRATIONS:
      _default: true
    STATS__TRACING__FORMAT:
      _default: json
    STATS__METRICS__ENABLED:
      _default: true
    STATS__BLOCKSCOUT_DB_URL:
      _default: postgresql://postgres:@blockscout-v2-backend:5432/postgres?ssl=false
    STATS__DB_URL:
      _default: postgres://postgres:@blockscout-v2-backend:5432/stats


imagePullSecrets: []
nameOverride: "blockscout-v2-frontend"
fullnameOverride: "blockscout-v2-frontend"

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "v2-serv-blockscout-frontend"

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000
terminationGracePeriodSeconds: 300
service:
  type: ClusterIP
  postgres: 5432
  bs: 4000
  bs_rs: 8052
  bs_stats_http: 8050
  bs_stats_metrics: 6060
  bs_frontend: 3000


ingress:
  enabled: false
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-production
  hosts: []
    # - host: midgard.example.com
    #   paths:
    #   - path: /
    #     backend:
    #       serviceName: gateway
    #       servicePort: midgard
  tls: []
    # - secretName: midgard-tls
    #   hosts:
    #     - midgard.example.com

persistence:
  enabled: false
  size:
    testnet: 50Gi
    stagenet: 150Gi
    mainnet: 200Gi
  accessMode: ReadWriteOnce
#  storageClass: gp3

resources:
  postgres:
    limits:
      cpu: 0.5
      memory: 10Gi
    requests:
      cpu: 0.2
      memory: 8Gi
  smart_contract_verifier:
    limits:
      cpu: 0.05
      memory: 50Mi
    requests:
      cpu: 0.01
      memory: 20Mi
  stats:
    limits:
      memory: "0.15Gi"
      cpu: "0.15"
    requests:
      memory: "0.1Gi"
      cpu: "0.1"
  frontend:
    limits:
      memory: "300Mi"
      cpu: "0.1"
    requests:
      memory: "250Mi"
      cpu: "0.05"

readinessProbe:
  postgres:
    enable: true
  scVerifier:
    enable: false
    path: /health?service=
    params:
      initialDelaySeconds: 60
      periodSeconds: 10
      timeoutSeconds: 60
  stats:
    path: /health
    enable: false
    params:
      initialDelaySeconds: 60
      periodSeconds: 10
      timeoutSeconds: 60
  frontend:
    enable: false
    path: /api/healthz
    params:
      initialDelaySeconds: 60
      periodSeconds: 10
      timeoutSeconds: 30


livenessProbe:
  postgres:
    enable: true
  scVerifier:
    enable: false
    path: /health?service=
    params:
      initialDelaySeconds: 100
      periodSeconds: 100
      timeoutSeconds: 30
  stats:
    path: /health
    enable: false
    params:
      initialDelaySeconds: 100
      periodSeconds: 100
      timeoutSeconds: 30
  frontend:
    path: /api/healthz
    enable: false
    params:
      initialDelaySeconds: 100
      periodSeconds: 100
      timeoutSeconds: 30

nodeSelector: {}

tolerations: []

affinity: {}

postgres:
  environment:
    POSTGRES_USER:
      _default: 'postgres'
    POSTGRES_HOST_AUTH_METHOD:
      _default: 'trust'
  files:
    mountPath: /docker-entrypoint-initdb.d
    list:
      init.sql: |
        CREATE DATABASE stats;
        GRANT ALL PRIVILEGES ON DATABASE stats TO postgres;
        CREATE DATABASE blockscout;
        GRANT ALL PRIVILEGES ON DATABASE stats TO postgres;
      config.toml: |-
        [server]
        addr = "0.0.0.0:8043"
    
        [compilers]
        # if omitted, number of CPU cores would be used
        max_threads = 8
    
        [solidity]
        enabled = true
        compilers_dir = "/tmp/solidity-compilers"
        refresh_versions_schedule = "0 0 * * * * *"
        [solidity.fetcher.list]
        # It depends on the OS you are running the service on
        list_url = "https://solc-bin.ethereum.org/linux-amd64/list.json"
        # list_url = "https://solc-bin.ethereum.org/macosx-amd64/list.json"
        # list_url = "https://solc-bin.ethereum.org/windows-amd64/list.json"
    
        #[solidity.fetcher.s3]
        #access_key = "access_key"
        #secret_key = "secret_key"
        #region = "region"
        #endpoint = "endpoint"
        ## The only required field for the s3 fetcher
        #bucket = "bucket"
    
        [vyper]
        enabled = true
        compilers_dir = "/tmp/vyper-compilers"
        refresh_versions_schedule = "0 0 * * * * *"
        [vyper.fetcher.list]
        list_url = "https://raw.githubusercontent.com/blockscout/solc-bin/main/vyper.list.json"
        # list_url = "https://raw.githubusercontent.com/blockscout/solc-bin/main/vyper.macos.list.json"
    
        [sourcify]
        enabled = true
        api_url = "https://sourcify.dev/server/"
        verification_attempts = 3
        request_timeout = 10
    
        # [extensions.solidity.sig_provider]
        # url = "http://127.0.0.1:8051/"
    
        # [extensions.vyper.sig_provider]
        # url = "http://127.0.0.1:8051/"
    
        # [extensions.sourcify.sig_provider]
        # url = "http://127.0.0.1:8051/"
    
        [metrics]
        enabled = false
        addr = "0.0.0.0:6060"
        route = "/metrics"
    
        [jaeger]
        enabled = false
        agent_endpoint = "localhost:6831"


# necessary for lint
global:
  images:
    alpine:
      tag: foo
      hash: bar
